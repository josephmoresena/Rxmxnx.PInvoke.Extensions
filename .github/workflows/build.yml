name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
permissions:
  actions: write
  contents: write
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            2.0.x
            2.1.x
            3.0.x
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x
      - name: Setup Tree .NET Core Pre-requisites
        run: |
          sudo apt-get install tree unzip gdb lldb libc6-dbg --assume-yes
          
          wget https://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.0g-2ubuntu4_amd64.deb
          sudo dpkg -i libssl1.1_1.1.0g-2ubuntu4_amd64.deb
          rm libssl1.1_1.1.0g-2ubuntu4_amd64.deb

          wget https://archive.ubuntu.com/ubuntu/pool/main/o/openssl1.0/libssl1.0.0_1.0.2n-1ubuntu5.13_amd64.deb
          sudo dpkg -i libssl1.0.0_1.0.2n-1ubuntu5.13_amd64.deb
          rm libssl1.0.0_1.0.2n-1ubuntu5.13_amd64.deb

          # .NET Core 2.1 only probes ICU through version 70. Ubuntu 26.04 ships a newer libicu.
          wget https://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu70_70.1-2_amd64.deb
          sudo dpkg -i libicu70_70.1-2_amd64.deb
          rm libicu70_70.1-2_amd64.deb
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path ./.sonar/scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner
      - name: Remove ApplicationTest
        shell: bash
        run: |
          find src/ApplicationTest -name "*.*proj" -exec dotnet sln src remove {} \;
          mv src/ApplicationTest ./ApplicationTest
          rm -rf src/LegacyAppTest
      - name: Install Mono Framework
        run: |
          bash ./Install-Mono.sh
          mv ./ApplicationTest src/ApplicationTest
      - name: Clean test results
        run: |
          rm -rf TestResults/
          dotnet clean src --configuration Release
      - name: Build and analyze Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          $sonarStarted = $false
          $failure = $null

          try {
            # ----------------------------------------
            # SonarQube - Begin
            # ----------------------------------------
            Write-Host "Starting SonarScanner..."

            if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
              Write-Warning "SONAR_TOKEN is not available. SonarQube analysis will be skipped."
            }
            else {
              ./.sonar/scanner/dotnet-sonarscanner begin `
                /k:"josephmoresena_PInvoke.Extensions" `
                /o:"josephmoresena" `
                /d:sonar.token="$env:SONAR_TOKEN" `
                /d:sonar.host.url="https://sonarcloud.io" `
                /d:sonar.scanner.scanAll=false `
                /d:sonar.coverage.exclusions="**Test.cs,**Tests.cs,**test.cs,**tests.cs,**.SourceGenerator/*.cs" `
                /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx" `
                /d:sonar.cs.opencover.reportsPaths="TestResults/*/coverage.opencover.xml" `
                /d:sonar.cpd.exclusions="**/NativeUtilities/**FixedAction.cs,**/NativeUtilities/**FixedFunc.cs,**/IManagedBinaryBuffer/StaticCompose.cs,**Test/**Tests**/**.cs,**/Localization/**MessageResource.cs,**/FrameworkCompat/MarvinCompat.cs,**/Fixed*ValueExtensions.cs,**/BootstrapTypes.cs,**/FixedCStringSequence.cs,**/FixedPointerListValueExtensions/*.cs"

              if ($LASTEXITCODE -eq 0 -and (Test-Path ".sonarqube/conf/SonarQubeAnalysisConfig.xml")) {
                $sonarStarted = $true
                Write-Host "SonarScanner started successfully."
              }
              else {
                Write-Warning "SonarScanner begin failed. Continuing with build and tests."
              }
            }

            # ----------------------------------------
            # Restore
            # ----------------------------------------
            Write-Host "Restoring..."

            dotnet restore src

            if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed with exit code $LASTEXITCODE"
            }

            # ----------------------------------------
            # Build
            # ----------------------------------------
            Write-Host "Building..."

            dotnet build src `
              /p:MultipleFrameworkTest=true `
              --configuration Release `
              --disable-build-servers `
              /nr:false `
              /maxcpucount:1

            if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed with exit code $LASTEXITCODE"
            }

            # ----------------------------------------
            # Tests
            # ----------------------------------------
            Write-Host "Testing..."

            dotnet test src `
              /p:MultipleFrameworkTest=true `
              /p:CollectXPlatCoverage=true `
              --verbosity normal `
              --results-directory TestResults/ `
              --logger "trx;verbosity=detailed" `
              --no-build `
              --no-restore `
              --configuration Release `
              -- `
              DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

            if ($LASTEXITCODE -ne 0) {
              throw "dotnet test failed with exit code $LASTEXITCODE"
            }
          }
          catch {
            $failure = $_
          }
          finally {
            # ----------------------------------------
            # SonarQube - End
            # ----------------------------------------
            if ($sonarStarted) {
              Write-Host "Finishing SonarScanner..."

              ./.sonar/scanner/dotnet-sonarscanner end `
                /d:sonar.token="$env:SONAR_TOKEN"

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "SonarScanner end failed."
              }
              elseif ($null -eq $failure) {
                Write-Host "SonarQube analysis completed successfully."
              }
              else {
                Write-Warning "SonarScanner finished after a build or test failure."
              }
            }
            elseif ($null -eq $failure) {
              Write-Warning "SonarQube analysis was skipped."
            }
          }

          if ($null -ne $failure) {
            throw $failure
          }
      - name: Pack assembly
        working-directory: ./package/Rxmxnx.PInvoke.Extensions
        run: |
          dotnet pack -c Release -o ../Nuget /p:Version=9999.99.99.99-tmp /p:NoIntermediateBuild=true /p:UseEmbeddedDebugSymbols=false
          for package in ../Nuget/Rxmxnx.PInvoke.Extensions*.*nupkg; do
            echo "-----------------------------------"
            TEMP_DIR=$(mktemp -d)
            unzip -q "$package" -d "$TEMP_DIR"
            ls -sh "$package"
            tree "$TEMP_DIR" -h --noreport | tail -n +2 | sed "s|$TEMP_DIR/||"
            rm -rf "$TEMP_DIR"
          done
          echo "-----------------------------------"
      - name: Compile ApplicationTest (Mono-Build)
        working-directory: ./src/ApplicationTest/Rxmxnx.PInvoke.ApplicationTest
        shell: bash
        run: |
          msbuild -restore /p:Configuration=Release /p:UsePackage=true \
            /p:OutDir=../../../artifacts/Mono/Rxmxnx.PInvoke.ApplicationTest
          rm -rf ./obj
      - name: Compile ApplicationTest (Mono-Build) Legacy
        working-directory: ./src/ApplicationTest/Rxmxnx.PInvoke.ApplicationTest.Legacy
        shell: bash
        run: |
          msbuild -restore /p:Configuration=Release /p:UsePackage=true \
            /p:OutDir=../../../artifacts/Mono/Rxmxnx.PInvoke.ApplicationTest.Legacy
          rm -rf ./obj
      - name: Cache NuGet Packages
        uses: actions/cache/save@v6
        with:
          path: ./package/Nuget
          key: internal-nuget-${{ github.run_id }}
          enableCrossOsArchive: true
      - name: Cache Compiled ApplicationTest (Mono-Build)
        uses: actions/cache/save@v6
        with:
          path: |
            ./artifacts/Mono/Rxmxnx.PInvoke.ApplicationTest
            ./artifacts/Mono/Rxmxnx.PInvoke.ApplicationTest.Legacy
          key: internal-monoapp-bin-${{ github.run_id }}
          enableCrossOsArchive: true
      - name: Cache Compiled Tests
        uses: actions/cache/save@v6
        with:
          path: |
            ./src/Test/**/bin/Release/netstandard2.0
            ./src/Test/**/bin/Release/netstandard2.1
            ./src/Test/**/bin/Release/net9.0
          key: internal-tests-bin-${{ github.run_id }}
  
  webasm-actions:
    needs: [ build ]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/webasm-actions.yml
  freebsd-actions:
    needs: [ build ]
    uses: ./.github/workflows/freebsd-actions.yml
    with:
      run_tests: true
      build_artifacts: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
  cross-actions:
    needs: [ build ]
    uses: ./.github/workflows/cross-actions.yml
    with:
      run_tests: true
      build_artifacts: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
  
  cleanup-cache:
    name: Secure Cleanup
    needs: [ build, webasm-actions, freebsd-actions, cross-actions ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Delete Internal Cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Deleting caches..."
          gh cache delete "internal-nuget-${{ github.run_id }}" || true
          gh cache delete "internal-monoapp-bin-${{ github.run_id }}" || true
          gh cache delete "internal-tests-bin-${{ github.run_id }}" || true
